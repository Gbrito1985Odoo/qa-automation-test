name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP Baseline Scan (SauceDemo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://www.saucedemo.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: true
          artifact_name: 'zap-baseline-report'

  zap-api-scan:
    name: ZAP API Scan (Booker)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-api-scan@v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: openapi
          target: 'https://restful-booker.herokuapp.com/apidoc'
          rules_file_name: '.zap/rules-api.tsv'
          allow_issue_writing: false
          fail_action: false
          artifact_name: 'zap-api-report'

  sca-audit:
    name: SCA npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Scan
        run: |
          mkdir -p reports/security
          npm audit --json > reports/security/npm-audit.json || true
          npx ts-node scripts/generate-sca-report.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: reports/security/sca-report.html
          retention-days: 30

  dependency-check:
    name: OWASP Dependency-Check (opcional)
    if: ${{ vars.ENABLE_DEPENDENCY_CHECK == 'true' }}
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Dependency-Check
        run: |
          VERSION=12.1.0
          curl -sSL "https://github.com/dependency-check/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip" -o dc.zip
          unzip -q dc.zip
      - name: Scan
        run: |
          mkdir -p reports/security
          ./dependency-check/bin/dependency-check.sh \
            --project "qa-automation-test" \
            --scan . \
            --format HTML \
            --out reports/security/dependency-check-report.html \
            --failOnCVSS 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/security/dependency-check-report.html
          retention-days: 30
